<script>
  // Password Visibility Toggle
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('input-password');
  const eyeIcon = document.getElementById('eye-icon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', function() {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
    });
  }

  // Interactive navigation trigger for Demo login & Standard login
  function triggerNavigation(destination) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'NAVIGATE_SCREEN', screen: destination }, '*');
    }
    // Also dispatch custom event for local shells
    window.dispatchEvent(new CustomEvent('portal-navigate', { detail: { screen: destination } }));
  }

  const demoLoginBtn = document.getElementById('btn-demo-login');
  if (demoLoginBtn) {
    demoLoginBtn.addEventListener('click', function() {
      triggerNavigation('D1-Abstract-List');
    });
  }

  const signInBtn = document.getElementById('btn-sign-in');
  if (signInBtn) {
    signInBtn.addEventListener('click', function() {
      triggerNavigation('D1-Abstract-List');
    });
  }
