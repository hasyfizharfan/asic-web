  function openDrawer(mode, name, role) {
    const drawer = document.getElementById('quickEditDrawer');
    const panel = document.getElementById('drawerPanel');
    const tag = document.getElementById('drawerActionTag');
    const title = document.getElementById('drawerTitle');
    const inputName = document.getElementById('inputName');
    const inputRole = document.getElementById('inputRole');

    if (mode === 'new') {
      tag.textContent = 'Create New Entry';
      title.textContent = 'Add Speaker Profile';
      inputName.value = '';
      document.getElementById('inputInstitution').value = '';
    } else {
      tag.textContent = 'Edit Speaker Entry';
      title.textContent = role || 'Keynote Speaker';
      if (name) inputName.value = name;
      if (role) inputRole.value = role;
    }

    drawer.classList.remove('pointer-events-none');
    drawer.classList.add('opacity-100');
    panel.classList.remove('translate-x-full');
  }

  function closeDrawer() {
    const drawer = document.getElementById('quickEditDrawer');
    const panel = document.getElementById('drawerPanel');
    panel.classList.add('translate-x-full');
    drawer.classList.remove('opacity-100');
    setTimeout(() => {
      drawer.classList.add('pointer-events-none');
    }, 250);
  }

  function saveEntry() {
    const btn = document.getElementById('publishBatchBtn');
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh<§/span><span>Publishing...<§/span>';
    closeDrawer();
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check<§/span><span>Changes Published!<§/span>';
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">publish<§/span><span>Publish All Changes<§/span>';
      }, 2000);
    }, 700);
  }

  function triggerPublishFeedback() {
    const btn = document.getElementById('publishBatchBtn');
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh<§/span><span>Syncing CDN...<§/span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check<§/span><span>Sync Completed!<§/span>';
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">publish<§/span><span>Publish All Changes<§/span>';
      }, 2200);
    }, 800);
  }

  function forceSync() {
    const btn = document.getElementById('syncBtn');
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync<§/span><span>Purging Cache...<§/span>';
