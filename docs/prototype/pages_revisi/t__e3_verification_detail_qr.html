<§/div>
<span class="">•<§/span>
<div class="">Proof uploaded 24 Sep 2026, 15:02:11 WIB via Author Portal<§/div>
<§/div>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm uppercase text-outline">Internal Audit Ref:<§/span>
<span class="font-mono text-label-sm text-on-surface font-semibold">TR-2027-AU-0841-B<§/span>
<§/div>
<§/div>

<script>
  (function() {
    let currentZoom = 1;
    let currentRotation = 0;
    const canvas = document.getElementById('voucherCanvas');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnRotate = document.getElementById('btnRotate');
    const btnReset = document.getElementById('btnReset');
    const btnToggleReject = document.getElementById('btnToggleReject');
    const btnCloseReject = document.getElementById('btnCloseReject');
    const rejectionPanel = document.getElementById('rejectionPanel');
    const btnVerify = document.getElementById('btnVerify');
    const btnConfirmRejection = document.getElementById('btnConfirmRejection');
    const statusToast = document.getElementById('statusToast');
    const rejectReasonSelect = document.getElementById('rejectReasonSelect');
    const rejectNotes = document.getElementById('rejectNotes');

    function updateTransform() {
      if (canvas) {
        canvas.style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
      }
    }

    if (btnZoomIn) {
      btnZoomIn.addEventListener('click', () => {
        if (currentZoom < 2.2) {
          currentZoom += 0.2;
          updateTransform();
        }
      });
    }

    if (btnZoomOut) {
      btnZoomOut.addEventListener('click', () => {
        if (currentZoom > 0.6) {
          currentZoom -= 0.2;
          updateTransform();
        }
      });
    }

    if (btnRotate) {
      btnRotate.addEventListener('click', () => {
        currentRotation = (currentRotation + 90) % 360;
        updateTransform();
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', () => {
        currentZoom = 1;
        currentRotation = 0;
        updateTransform();
      });
    }

    if (btnToggleReject && rejectionPanel) {
      btnToggleReject.addEventListener('click', () => {
        rejectionPanel.classList.toggle('hidden');
        if (!rejectionPanel.classList.contains('hidden')) {
          rejectionPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    if (btnCloseReject && rejectionPanel) {
      btnCloseReject.addEventListener('click', () => {
        rejectionPanel.classList.add('hidden');
      });
    }

    if (rejectReasonSelect && rejectNotes) {
      rejectReasonSelect.addEventListener('change', (e) => {
        const value = e.target.value;
        if (value === 'illegible') {
          rejectNotes.value = 'The submitted image is illegible or too low resolution to verify the bank reference RRN.';
        } else if (value === 'nominal_mismatch') {
          rejectNotes.value = 'Transferred nominal does not match the invoice requirement of IDR 3.750.000.';
        } else if (value === 'duplicate_slip') {
          rejectNotes.value = 'This payment slip reference number has already been registered for another participant registration.';
        } else if (value === 'unregistered_account') {
          rejectNotes.value = 'Beneficiary account differs from Universitas Andalas ASIC 2027 official account.';
        }
      });
    }

    if (btnVerify && statusToast) {
      btnVerify.addEventListener('click', () => {
        btnVerify.disabled = true;
        btnVerify.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync<§/span><span>Processing...<§/span>';
        
        setTimeout(() => {
          btnVerify.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle<§/span><span>Verified<§/span>';
          btnVerify.classList.remove('bg-tertiary-container', 'hover:bg-tertiary-fixed-dim');
          btnVerify.classList.add('bg-secondary', 'text-on-secondary');
          statusToast.classList.remove('hidden');
          if (rejectionPanel) rejectionPanel.classList.add('hidden');
        }, 600);
      });
    }

    if (btnConfirmRejection && rejectionPanel) {
      btnConfirmRejection.addEventListener('click', () => {
        if (!rejectReasonSelect.value && !rejectNotes.value.trim()) {
          alert('Please select or specify a reason for rejecting the invoice.');
          return;
        }
        btnConfirmRejection.disabled = true;
        btnConfirmRejection.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">sync<§/span> Sending Rejection...';
        setTimeout(() => {
          rejectionPanel.innerHTML = '<div class="p-4 text-center text-error font-label-md"><span class="material-symbols-outlined text-[28px] mb-1">cancel<§/span><p>Invoice #INV-2027-0104 marked as Rejected. Notice sent to author.<§/p><§/div>';
        }, 600);
      });
    }
  })();
<§/script><§/main><§/div><§/div>
