<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('admin-password');
    const toggleIcon = document.getElementById('password-toggle-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      toggleIcon.textContent = 'visibility';
    }
  }

  function setLanguage(lang) {
    const btnEn = document.getElementById('lang-en');
    const btnId = document.getElementById('lang-id');
    
    if (lang === 'en') {
      btnEn.className = 'px-3 py-1 rounded-lg text-label-sm font-label-sm transition-all duration-150 bg-surface-container-lowest text-primary shadow-sm font-semibold';
      btnId.className = 'px-3 py-1 rounded-lg text-label-sm font-label-sm transition-all duration-150 text-on-surface-variant hover:text-on-surface font-medium';
      showAlert('Language switched to English.', 'info');
    } else {
      btnId.className = 'px-3 py-1 rounded-lg text-label-sm font-label-sm transition-all duration-150 bg-surface-container-lowest text-primary shadow-sm font-semibold';
      btnEn.className = 'px-3 py-1 rounded-lg text-label-sm font-label-sm transition-all duration-150 text-on-surface-variant hover:text-on-surface font-medium';
      showAlert('Bahasa dialihkan ke Bahasa Indonesia.', 'info');
    }
  }

  function showAlert(message, type) {
    const alertBox = document.getElementById('auth-alert');
    const alertMsg = document.getElementById('auth-alert-msg');
    const alertIcon = document.getElementById('auth-alert-icon');
    
    alertBox.classList.remove('hidden');
    alertMsg.textContent = message;
    
    if (type === 'success') {
      alertIcon.textContent = 'check_circle';
      alertIcon.className = 'material-symbols-outlined text-[18px] text-primary';
    } else if (type === 'error') {
      alertIcon.textContent = 'error';
      alertIcon.className = 'material-symbols-outlined text-[18px] text-error';
    } else {
      alertIcon.textContent = 'info';
      alertIcon.className = 'material-symbols-outlined text-[18px] text-secondary';
    }
  }

  function handleForgotPassword(e) {
    e.preventDefault();
    showAlert('Password reset token dispatch requested. Please check your institutional email.', 'info');
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-login-btn');
    const spinner = document.getElementById('submit-spinner');
    const label = document.getElementById('submit-label');
    
    spinner.classList.remove('hidden');
    label.textContent = 'Verifying Credentials...';
    submitBtn.disabled = true;

    setTimeout(() => {
      spinner.classList.add('hidden');
      label.textContent = 'Signed In Successfully';
      showAlert('Session initialized. Forwarding to Conference Dashboard...', 'success');
      submitBtn.disabled = false;
    }, 1100);
  }

  function fillAndSubmitDemo() {
    const identity = document.getElementById('admin-identity');
    const password = document.getElementById('admin-password');
    const remember = document.getElementById('remember-device');
    
    identity.value = 'secretariat.chair@asic2027.unand.ac.id';
    password.value = 'ASIC2027#LeadAdminKey';
    remember.checked = true;

    showAlert('Demo Admin profile loaded. Authorizing session...', 'success');

    const submitBtn = document.getElementById('submit-login-btn');
    const spinner = document.getElementById('submit-spinner');
    const label = document.getElementById('submit-label');

    spinner.classList.remove('hidden');
    label.textContent = 'Authenticating Demo Admin...';
    submitBtn.disabled = true;

    setTimeout(() => {
      spinner.classList.add('hidden');
      label.textContent = 'Redirecting to Dashboard...';
      showAlert('Welcome, Prof. Dr. Ir. Administrator (Committee Chair).', 'success');
      submitBtn.disabled = false;
    }, 900);
  }
