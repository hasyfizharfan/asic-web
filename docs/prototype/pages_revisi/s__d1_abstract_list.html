<script>
  // Fast Drawer interaction logic for secretariat screening workflow
  const drawer = document.getElementById('quick-action-drawer');
  const closeDrawerBtn = document.getElementById('close-drawer-btn');
  const fullDetailLink = document.getElementById('full-detail-link');
  const drawerTitle = document.getElementById('drawer-title');
  const drawerSubId = document.getElementById('drawer-sub-id');
  const drawerTrack = document.getElementById('drawer-track');
  const rows = document.querySelectorAll('tbody tr');

  function openDrawer(row) {
    const id = row.getAttribute('data-row-id');
    const title = row.querySelector('.font-title-sm').innerText;
    const track = row.querySelector('.font-label-sm').innerText;

    drawerSubId.innerText = `#${id}`;
    drawerTitle.innerText = title;
    drawerTrack.innerText = track;
    fullDetailLink.setAttribute('data-target-id', id);

    drawer.classList.remove('translate-x-full');
  }

  function closeDrawer() {
    drawer.classList.add('translate-x-full');
  }

  rows.forEach(row => {
    row.addEventListener('click', (e) => {
      // Don't duplicate if clicking action button directly
      openDrawer(row);
    });
  });

  closeDrawerBtn.addEventListener('click', closeDrawer);

  fullDetailLink.addEventListener('click', (e) => {
    e.preventDefault();
    const activeId = drawerSubId.innerText;
    // Secretariat router simulation
    const navAbstract = document.querySelector('aside a[data-path="d1-abstract-list"]');
    if (navAbstract) {
      window.location.hash = `d2-abstract-detail?id=${encodeURIComponent(activeId)}`;
    }
  });

  // Filter tabs state styling
  const statusTabs = document.querySelectorAll('.status-tab');
  statusTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      statusTabs.forEach(t => {
        t.classList.remove('bg-primary', 'text-on-primary', 'font-bold', 'shadow-xs');
        t.classList.add('bg-surface-container-low', 'text-on-surface-variant');
      });
      tab.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
      tab.classList.add('bg-primary', 'text-on-primary', 'font-bold', 'shadow-xs');
    });
  });

  // Search input quick clear
  const searchInput = document.getElementById('search-input');
  const clearSearch = document.getElementById('clear-search');

  searchInput.addEventListener('input', () => {
    if (searchInput.value.length > 0) {
      clearSearch.classList.remove('hidden');
    } else {
      clearSearch.classList.add('hidden');
    }
  });

  clearSearch.addEventListener('click', () => {
    searchInput.value = '';
    clearSearch.classList.add('hidden');
    searchInput.focus();
  });
<§/script><§/main><§/div><§/body><§/html>
