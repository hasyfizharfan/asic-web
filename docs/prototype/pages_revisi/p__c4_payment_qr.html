<script>
    (function() {
      // Highlight Payment nav item in sidebar
      const navLinks = document.querySelectorAll('aside nav a');
      navLinks.forEach(link => {
        if (link.getAttribute('data-path') === 'payment') {
          link.className = "flex items-center gap-space-sm rounded-xl px-space-md py-space-sm font-label-lg text-label-lg bg-primary-container text-on-primary shadow-sm border-l-4 border-tertiary-fixed transition-colors";
        }
      });
    })();

    function selectPaymentMethod(method) {
      const qrCard = document.getElementById('method-qr');
      const paypalCard = document.getElementById('method-paypal');
      const qrFlow = document.getElementById('qr-payment-flow');
      const paypalFlow = document.getElementById('paypal-payment-flow');

      if (method === 'qr') {
        qrCard.classList.remove('bg-surface-container-lowest', 'opacity-80');
        qrCard.classList.add('bg-surface-container-lowest', 'shadow-md');
        document.getElementById('radio-qr-outer').classList.add('bg-primary-container');
        document.getElementById('radio-qr-inner').classList.remove('scale-0');

        paypalCard.classList.remove('shadow-md');
        paypalCard.classList.add('opacity-75');
        document.getElementById('radio-paypal-outer').classList.remove('bg-primary-container');
        document.getElementById('radio-paypal-inner').classList.add('scale-0');

        qrFlow.classList.remove('hidden');
        paypalFlow.classList.add('hidden');
      } else {
        paypalCard.classList.remove('opacity-75');
        paypalCard.classList.add('shadow-md');
        document.getElementById('radio-paypal-outer').classList.add('bg-primary-container');
        document.getElementById('radio-paypal-inner').classList.remove('scale-0');

        qrCard.classList.remove('shadow-md');
        qrCard.classList.add('opacity-75');
        document.getElementById('radio-qr-outer').classList.remove('bg-primary-container');
        document.getElementById('radio-qr-inner').classList.add('scale-0');

        qrFlow.classList.add('hidden');
        paypalFlow.classList.remove('hidden');
      }
    }

    function removeFile() {
      const preview = document.getElementById('file-preview-card');
      const emptyState = document.getElementById('upload-dropzone-inner');
      preview.classList.add('hidden');
      emptyState.classList.remove('hidden');
    }
