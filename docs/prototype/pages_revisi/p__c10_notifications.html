<§!-- Micro-interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Filter functionality
      const filterButtons = document.querySelectorAll('#notification-filter-tabs .filter-tab');
      const items = document.querySelectorAll('#notifications-list .notification-item');

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          // Remove active styles from all buttons
          filterButtons.forEach(b => {
            b.classList.remove('bg-primary', 'text-on-primary');
            b.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
          });

          // Set active styles to clicked button
          btn.classList.add('bg-primary', 'text-on-primary');
          btn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');

          const filter = btn.getAttribute('data-filter');

          items.forEach(item => {
            if (filter === 'all' || item.getAttribute('data-category') === filter) {
              item.style.display = 'flex';
            } else {
              item.style.display = 'none';
            }
          });
        });
      });

      // Mark All as Read Action
      const markAllBtn = document.getElementById('mark-all-read-btn');
      if (markAllBtn) {
        markAllBtn.addEventListener('click', () => {
          const unreadItems = document.querySelectorAll('.notification-item.unread');
          unreadItems.forEach(item => {
            item.classList.remove('unread');
            item.classList.add('read', 'opacity-95');
            const dot = item.querySelector('.animate-ping');
            if (dot && dot.parentElement) {
              dot.parentElement.remove();
            }
          });
          markAllBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check<§/span><span>All Caught Up<§/span>';
          markAllBtn.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
      }
    });
  <§/script>
