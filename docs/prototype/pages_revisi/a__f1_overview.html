    const filterButtons = document.querySelectorAll('.activity-filter-btn');

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // Toggle styles
        filterButtons.forEach(b => {
          b.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm', 'font-semibold');
          b.classList.add('text-on-surface-variant', 'font-medium');
        });
        btn.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm', 'font-semibold');
        btn.classList.remove('text-on-surface-variant', 'font-medium');

        const category = btn.getAttribute('data-filter');

        items.forEach(item => {
          if (category === 'all' || item.getAttribute('data-category') === category) {
            item.style.display = 'flex';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
