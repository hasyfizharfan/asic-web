<script>
  function updateParticipationMode(mode) {
    const abstractSec = document.getElementById('abstractSection');
    const pubWrapper = document.getElementById('publicationOptionWrapper');
    
    const cardOral = document.getElementById('card-oral');
    const cardPoster = document.getElementById('card-poster');
    const cardListener = document.getElementById('card-listener');

    const badgeOral = document.getElementById('badge-oral');
    const badgePoster = document.getElementById('badge-poster');
    const badgeListener = document.getElementById('badge-listener');

    // Reset badges
    badgeOral.className = 'rounded-full bg-surface-container-highest px-3 py-1 font-label-md text-label-md text-on-surface-variant';
    badgeOral.innerText = 'Available';
    badgePoster.className = 'rounded-full bg-surface-container-highest px-3 py-1 font-label-md text-label-md text-on-surface-variant';
    badgePoster.innerText = 'Available';
    badgeListener.className = 'rounded-full bg-surface-container px-3 py-1 font-label-md text-label-md text-on-surface-variant';
    badgeListener.innerText = 'Attendance Only';

    if (mode === 'oral') {
      badgeOral.className = 'rounded-full bg-primary px-3 py-1 font-label-md text-label-md text-on-primary';
      badgeOral.innerText = 'Selected';
    } else if (mode === 'poster') {
      badgePoster.className = 'rounded-full bg-primary px-3 py-1 font-label-md text-label-md text-on-primary';
      badgePoster.innerText = 'Selected';
    } else if (mode === 'listener') {
      badgeListener.className = 'rounded-full bg-primary px-3 py-1 font-label-md text-label-md text-on-primary';
      badgeListener.innerText = 'Selected';
    }

    if (mode === 'listener') {
      if (abstractSec) {
        abstractSec.style.opacity = '0.4';
        abstractSec.style.pointerEvents = 'none';
      }
      if (pubWrapper) {
        pubWrapper.style.opacity = '0.4';
        pubWrapper.style.pointerEvents = 'none';
      }
    } else {
      if (abstractSec) {
        abstractSec.style.opacity = '1';
        abstractSec.style.pointerEvents = 'auto';
      }
      if (pubWrapper) {
        pubWrapper.style.opacity = '1';
        pubWrapper.style.pointerEvents = 'auto';
      }
    }
  }

  function updateWordCount(textarea) {
    const text = textarea.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const label = document.getElementById('wordCountLabel');
    if (label) {
      label.innerText = `Words: ${words} / 300`;
      if (words > 300) {
        label.classList.add('text-error');
      } else {
        label.classList.remove('text-error');
      }
    }
  }

  function handleFileSelected(input) {
    const display = document.getElementById('fileNameDisplay');
    if (input.files && input.files[0] && display) {
      display.innerText = input.files[0].name;
    }
  }
<§/script><§/main><§/div><§/div><§/div><§/body><§/html>
