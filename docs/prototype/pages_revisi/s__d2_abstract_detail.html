<span class="font-label-lg text-label-lg text-primary font-bold block mb-1">1. Background &amp; Objective<§/span>
<p class="">
              Evaluation of native rhizobial strains isolated from undisturbed andosol and ultisol soils across the Mount Talang volcanic belt in West Sumatra. Conventional synthetic nitrogen fertilizers in humid tropical uplands suffer significant nutrient leaching, exacerbating acidification and nitrous oxide emissions. This study investigates the symbiotic capacity of four indigenous <span class="italic font-serif">Bradyrhizobium<§/span> strains to bolster biological nitrogen fixation (BNF) while advancing long-term soil organic carbon (SOC) persistence under continuous cassava-legume intercropping.
            <§/p>
<§/div>
<div class="p-space-md rounded-lg bg-surface-container-low/40">
<span class="font-label-lg text-label-lg text-primary font-bold block mb-1">2. Methodology<§/span>
<p class="">
              A multi-locational randomized complete block trial (RCBD) with five replications was deployed over two consecutive monsoonal cropping cycles across Solok and Tanah Datar regencies (elevation 650–920 m a.s.l.). Treatments comprised non-inoculated controls, commercial synthetic N (120 kg N/ha), and single versus consortia inoculation of indigenous isolates (UNAND-Rz01 through UNAND-Rz04) co-formulated with biochar carriers. Acetylene reduction assays (ARA), shoot biomass accumulation, nodule occupancy via PCR-RFLP, and permanganate oxidizable carbon (POXC) were systematically quantified.
            <§/p>
<§/div>

<span class="font-label-lg text-label-lg text-primary font-bold block mb-1">3. Key Results<§/span>
<p class="">

            <§/p>
<§/div>

<span class="font-label-lg text-label-lg text-primary font-bold block mb-1">4. Conclusion &amp; Policy Implications<§/span>
<p class="">
              Indigenous rhizobial strains offer viable, low-cost bio-enhancement for smallholder farming communities throughout humid tropical archipelagos. Adoption of custom inoculant regimes mitigates reliance on chemical fertilizer subsidies while restoring degraded volcanic slope soils.

      const letterPaper = document.getElementById('letterPaper');
      const letterSubject = document.getElementById('letterSubject');
      const letterRef = document.getElementById('letterRef');
      const letterBodyExcerpt = document.getElementById('letterBodyExcerpt');

      function showToast(title, message, isSuccess = true) {
        if (!toast) return;
        toastTitle.textContent = title;
        toastMessage.textContent = message;
        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
        }, 5500);
      }

      if (btnAccept) {
        btnAccept.addEventListener('click', () => {
          letterPaper.classList.add('ring-2', 'ring-primary');
          letterSubject.textContent = "Subject: Official Letter of Acceptance (LOA) & Participant Invitation";

            "Revision Request Dispatched",
