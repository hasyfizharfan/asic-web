<§!-- Interactive Submission Handler -->
<script>
    (function() {
      const form = document.getElementById('refund-form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          const declaration = document.getElementById('declaration');
          if (!declaration.checked) {
            alert('Please review and agree to the conference refund policy conditions.');
            return;
          }
          const submitBtn = form.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity<§/span><span>Verifying Submission...<§/span>';
          
          setTimeout(function() {
            submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check<§/span><span>Submitted for Review<§/span>';
            submitBtn.classList.remove('bg-[#F5C518]', 'hover:bg-[#E5B814]');
            submitBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
            alert('Refund request successfully logged for editorial and treasury evaluation. You will receive an official notification within 14 working days.');
          }, 1000);
        });
      }
    })();
