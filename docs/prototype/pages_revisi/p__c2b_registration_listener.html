<script>
  // Simple micro-interactions for listener flow
  document.addEventListener('DOMContentLoaded', () => {
    const tripCheckbox = document.getElementById('field-trip-toggle');
    const tripStateLabel = document.getElementById('field-trip-label-state');
    const submitBtn = document.getElementById('submit-listener-btn');

    if (tripCheckbox && tripStateLabel) {
      tripCheckbox.addEventListener('change', (e) => {
        if (e.target.checked) {
          tripStateLabel.textContent = 'Selected (Fee TBA)';
          tripStateLabel.classList.add('text-primary');
          tripStateLabel.classList.remove('text-on-surface-variant');
        } else {
          tripStateLabel.textContent = 'Optional Add-on';
          tripStateLabel.classList.remove('text-primary');
          tripStateLabel.classList.add('text-on-surface-variant');
        }
      });
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity<§/span>
          <span>Registering Listener...<§/span>
        `;
        setTimeout(() => {
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check_circle<§/span>
            <span>Registration Submitted!<§/span>
          `;
          submitBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
        }, 900);
      });
    }
  });
