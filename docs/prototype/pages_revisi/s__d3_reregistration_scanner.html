<script>
  // Interactive handlers for check-in demo experience
  document.addEventListener('DOMContentLoaded', () => {
    const confirmPrintBtn = document.getElementById('confirmPrintBtn');
    const scanNextBtn = document.getElementById('scanNextBtn');
    const torchBtn = document.getElementById('torchBtn');
    const toast = document.getElementById('toastNotification');
    const manualInput = document.getElementById('manualIdInput');
    const searchBtn = document.getElementById('searchBtn');

    // Trigger Print feedback toast
    if (confirmPrintBtn) {
      confirmPrintBtn.addEventListener('click', () => {
        confirmPrintBtn.disabled = true;
        confirmPrintBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh<§/span><span>Printing Badge...<§/span>';
        
        // Show Toast
        toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
        
        setTimeout(() => {
          confirmPrintBtn.disabled = false;
          confirmPrintBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">done_all<§/span><span>Badge Issued &amp; Completed<§/span>';
          confirmPrintBtn.classList.remove('bg-[#F5C518]');
          confirmPrintBtn.classList.add('bg-primary', 'text-white');
        }, 1500);

        setTimeout(() => {
          toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        }, 3800);
      });
    }

    // Reset workflow for next attendee
    if (scanNextBtn) {
      scanNextBtn.addEventListener('click', () => {
        if (confirmPrintBtn) {
          confirmPrintBtn.classList.remove('bg-primary', 'text-white');
          confirmPrintBtn.classList.add('bg-[#F5C518]', 'text-[#0F3D24]');
          confirmPrintBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: \'FILL\' 1;">print<§/span><span>Confirm &amp; Print Name Tag<§/span>';
        }
        manualInput.value = '';
        manualInput.focus();
      });
    }

    // Toggle Torch simulated indicator
    if (torchBtn) {
      torchBtn.addEventListener('click', () => {
        const icon = torchBtn.querySelector('.material-symbols-outlined');
        if (icon.innerText === 'flashlight_on') {
          icon.innerText = 'flashlight_off';
          torchBtn.classList.add('text-primary-fixed');
        } else {
          icon.innerText = 'flashlight_on';
          torchBtn.classList.remove('text-primary-fixed');
        }
      });
    }

    // Manual Search feedback simulation
    if (searchBtn) {
      searchBtn.addEventListener('click', () => {
        const originalText = searchBtn.innerHTML;
        searchBtn.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin">sync<§/span>';
        setTimeout(() => {
          searchBtn.innerHTML = originalText;
        }, 400);
      });
    }
  });
