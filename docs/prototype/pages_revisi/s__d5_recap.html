<§!-- Interactive JavaScript Handling Filtering & Micro-interactions -->
<script>
    function triggerExportNotice() {
      const toast = document.getElementById('exportToast');
      if (!toast) return;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 4000);
    }

    function filterTracks() {
      const query = document.getElementById('trackSearch').value.toLowerCase();
      const rows = document.querySelectorAll('#reconciliationTable tbody tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
      });
    }

    // Toggle Aggregate/Live button views
    const aggregateBtn = document.getElementById('view-aggregate');
    const day1Btn = document.getElementById('view-day1');
    const day2Btn = document.getElementById('view-day2');

    const buttons = [aggregateBtn, day1Btn, day2Btn];
    buttons.forEach(btn => {
      if (!btn) return;
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.className = "px-3 py-1.5 rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all";
        });
        btn.className = "px-3 py-1.5 rounded-md font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm font-semibold transition-all";
      });
    });
