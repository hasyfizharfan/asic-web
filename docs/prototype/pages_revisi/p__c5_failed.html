<script>
    // Micro-interactions for Action Buttons
    const retryBtn = document.getElementById('btnRetryPayPal');
    const switchBtn = document.getElementById('btnSwitchBank');
    const retryModal = document.getElementById('retryModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    if (retryBtn && retryModal && closeModalBtn) {
      retryBtn.addEventListener('click', () => {
        retryModal.classList.remove('opacity-0', 'pointer-events-none');
        retryModal.classList.add('opacity-100');
        setTimeout(() => {
          retryModal.classList.add('opacity-0', 'pointer-events-none');
          retryModal.classList.remove('opacity-100');
        }, 3200);
      });

      closeModalBtn.addEventListener('click', () => {
        retryModal.classList.add('opacity-0', 'pointer-events-none');
        retryModal.classList.remove('opacity-100');
      });
    }

    if (switchBtn) {
      switchBtn.addEventListener('click', () => {
        const paymentNav = document.querySelector('aside a[data-path="payment"]');
        if (paymentNav) {
          paymentNav.click();
        } else {
          window.location.hash = '#payment-bank-transfer';
        }
      });
    }
