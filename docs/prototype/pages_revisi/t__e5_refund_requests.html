<script>
    (function() {
      const searchInput = document.getElementById('refund-search');
      const filterPills = document.querySelectorAll('.filter-pill');
      const cards = document.querySelectorAll('.request-card');
      const approveBtn = document.getElementById('btn-approve');
      const declineBtn = document.getElementById('btn-decline');
      const noteInput = document.getElementById('auditor-note');
      const toast = document.getElementById('toast');
      const toastIcon = document.getElementById('toast-icon');
      const toastTitle = document.getElementById('toast-title');
      const toastMsg = document.getElementById('toast-msg');

      function showToast(type, title, msg) {
        toast.className = 'fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 pointer-events-auto flex items-center gap-3 px-space-lg py-space-md rounded-xl shadow-xl ' + 
          (type === 'success' ? 'bg-primary text-on-primary' : 'bg-error text-on-error');
        toastIcon.textContent = type === 'success' ? 'verified' : 'error';
        toastTitle.textContent = title;
        toastMsg.textContent = msg;

        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 4000);
      }

      filterPills.forEach(pill => {
        pill.addEventListener('click', () => {
          filterPills.forEach(p => {
            p.className = 'px-space-sm py-1 rounded-md text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface filter-pill';
          });
          pill.className = 'px-space-sm py-1 rounded-md text-label-sm font-label-sm bg-surface-container-lowest text-primary font-bold shadow-sm filter-pill';
          
          const status = pill.getAttribute('data-status');
          cards.forEach(card => {
            const cardId = card.getAttribute('data-id');
            if (status === 'all') {
              card.style.display = 'block';
            } else if (status === 'pending' && cardId === 'REF-2027-01') {
              card.style.display = 'block';
            } else if (status === 'approved' && cardId === 'REF-2027-02') {
              card.style.display = 'block';
            } else if (status === 'declined' && cardId === 'REF-2027-03') {
              card.style.display = 'block';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        cards.forEach(card => {
          const text = card.textContent.toLowerCase();
          card.style.display = text.includes(query) ? 'block' : 'none';
        });
      });

      approveBtn.addEventListener('click', () => {
        const note = noteInput.value.trim();
        if (!note) {
          showToast('error', 'Audit Note Required', 'Please provide justification note before approving disbursement.');
          noteInput.focus();
          return;
        }
        approveBtn.disabled = true;
        approveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh<§/span><span>Processing Release...<§/span>';
        
        setTimeout(() => {
          approveBtn.className = 'px-space-xl py-2.5 rounded-xl bg-secondary-fixed text-on-secondary-fixed font-label-lg text-label-lg flex items-center gap-2 shadow-sm cursor-default';
          approveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle<§/span><span>Refund Disbursed (IDR 3,500,000)<§/span>';
          declineBtn.style.display = 'none';
          showToast('success', 'Refund Disbursed Successfully', 'Voucher #VCH-2027-901 sent to Bank Nagari batch for Dr. Mahfuzur Rahman.');
        }, 1000);
      });

      declineBtn.addEventListener('click', () => {
        const note = noteInput.value.trim();
        if (!note) {
          showToast('error', 'Rejection Reason Mandatory', 'Specify the reason under ASIC fiscal bylaws.');
          noteInput.focus();
          return;
        }
        if (confirm('Decline refund request #REF-2027-01 permanently? This will notify author and retain escrow.')) {
          showToast('error', 'Request Declined', 'Author notified with audit commentary.');
        }
      });
    })();
