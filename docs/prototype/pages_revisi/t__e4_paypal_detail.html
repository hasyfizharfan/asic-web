<script>
  (function initPayPalAuditScreen() {
    const copyBtn = document.getElementById('copyTransBtn');
    const copyFeedback = document.getElementById('copyFeedback');
    const transIdText = document.getElementById('transIdText');
    const toast = document.getElementById('toastNotification');
    const toastTitle = document.getElementById('toastTitle');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    function showToast(title, msg, isError = false) {
      if (!toast) return;
      toastTitle.textContent = title;
      toastMsg.textContent = msg;
      
      if (isError) {
        toastIcon.className = "w-8 h-8 rounded-full bg-error-container text-on-error-container flex items-center justify-center";
        toastIcon.innerHTML = `<span class="material-symbols-outlined text-[20px]">warning<§/span>`;
      } else {
        toastIcon.className = "w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center";
        toastIcon.innerHTML = `<span class="material-symbols-outlined text-[20px]">check<§/span>`;
      }

      toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      }, 3200);
    }

    if (copyBtn && transIdText) {
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(transIdText.textContent.trim()).then(() => {
          copyFeedback.textContent = 'Copied!';
          setTimeout(() => {
            copyFeedback.textContent = 'Copy ID';
          }, 2000);
          showToast('Clipboard Updated', 'Transaction ID copied for banking audit.');
        }).catch(() => {
          showToast('Copy Failed', 'Please manually select the ID string.', true);
        });
      });
    }

    const flagBtn = document.getElementById('flagBtn');
    const flagAnomalousBtn = document.getElementById('flagAnomalousBtn');
    [flagBtn, flagAnomalousBtn].forEach(btn => {
      if (btn) {
        btn.addEventListener('click', () => {
          showToast('Review Dispatched', 'Transaction locked for Currency Audit committee review.', true);
        });
      }
    });

    const dlBtn1 = document.getElementById('downloadReceiptBtn');
    const dlBtn2 = document.getElementById('downloadReceiptBtn2');
    [dlBtn1, dlBtn2].forEach(btn => {
      if (btn) {
        btn.addEventListener('click', () => {
          showToast('Receipt Generation', 'Preparing PDF Gateway Clearance Voucher...');
        });
      }
    });
  })();
<§/script><§/main><§/div><§/div><§/body><§/html>
