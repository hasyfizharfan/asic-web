<§!-- Interactive Logic for Live Preview Updating & User Feedback -->
<script>
    (function initAnnouncementComposer() {
      const subjectInput = document.getElementById('subjectInput');
      const messageEditor = document.getElementById('messageEditor');
      const previewSubjectText = document.getElementById('previewSubjectText');
      const previewBodyText = document.getElementById('previewBodyText');
      const subjectLength = document.getElementById('subjectLength');
      const recipientCountBadge = document.getElementById('recipientCountBadge');
      const previewToLabel = document.getElementById('previewToLabel');

      // Live Mirroring
      if (subjectInput && previewSubjectText) {
        subjectInput.addEventListener('input', function(e) {
          const val = e.target.value.trim();
          previewSubjectText.textContent = val || '(Untitled Announcement Subject)';
          if (subjectLength) {
            subjectLength.textContent = `${e.target.value.length} / 120 chars`;
          }
        });
      }

      if (messageEditor && previewBodyText) {
        messageEditor.addEventListener('input', function(e) {
          const text = e.target.value;
          previewBodyText.textContent = text || 'No notice content entered.';
        });
      }

      // Audience selection badge updates
      const audienceCheckboxes = document.querySelectorAll('.audience-cb');
      function recalculateAudience() {
        let total = 0;
        let selectedNames = [];
        audienceCheckboxes.forEach(cb => {
          const badgeSpan = cb.nextElementSibling;
          if (cb.checked) {
            total += parseInt(cb.dataset.count, 10);
            selectedNames.push(cb.dataset.label);
            badgeSpan.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
            badgeSpan.classList.add('bg-primary', 'text-on-primary', 'shadow-xs');
          } else {
            badgeSpan.classList.remove('bg-primary', 'text-on-primary', 'shadow-xs');
            badgeSpan.classList.add('bg-surface-container-low', 'text-on-surface-variant');
          }
        });

        if (recipientCountBadge) {
          recipientCountBadge.textContent = `${total} Selected Recipients`;
        }
        if (previewToLabel) {
          previewToLabel.textContent = selectedNames.length ? selectedNames.join(', ') : 'No Audience Targeted';
        }
      }

      audienceCheckboxes.forEach(cb => {
        cb.addEventListener('change', recalculateAudience);
      });

      // Category Pill State Switcher
      const categoryPills = document.querySelectorAll('.category-pill');
      categoryPills.forEach(pill => {
        pill.addEventListener('click', function() {
          categoryPills.forEach(p => {
            p.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm', 'font-bold');
            p.classList.add('bg-surface-container-low', 'text-on-surface-variant', 'font-medium');
          });
          this.classList.remove('bg-surface-container-low', 'text-on-surface-variant', 'font-medium');
          this.classList.add('bg-primary', 'text-on-primary', 'shadow-sm', 'font-bold');
        });
      });

      // Dispatch Actions Simulation
      const dispatchBtn = document.getElementById('dispatchNowBtn');
      if (dispatchBtn) {
        dispatchBtn.addEventListener('click', function() {
          const originalHTML = this.innerHTML;
          this.disabled = true;
          this.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh<§/span> Dispatching to 142 recipients...';
          
          setTimeout(() => {
            this.innerHTML = '<span class="material-symbols-outlined text-[18px]">done_all<§/span> Dispatched Successfully!';
            this.classList.remove('bg-tertiary-fixed', 'text-on-tertiary-fixed');
            this.classList.add('bg-primary', 'text-on-primary');

            setTimeout(() => {
              this.innerHTML = originalHTML;
              this.classList.remove('bg-primary', 'text-on-primary');
              this.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed');
              this.disabled = false;
            }, 3000);
          }, 1400);
        });
      }

      // Preview Mode Toggles
      const previewEmailBtn = document.getElementById('previewModeEmail');
      const previewPortalBtn = document.getElementById('previewModePortal');
      const previewContainer = document.getElementById('previewCardContainer');

      if (previewEmailBtn && previewPortalBtn && previewContainer) {
        previewEmailBtn.addEventListener('click', function() {
          this.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-xs', 'font-bold');
          this.classList.remove('text-on-surface-variant');
          previewPortalBtn.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-xs', 'font-bold');
          previewPortalBtn.classList.add('text-on-surface-variant');
          previewContainer.classList.remove('p-1');
          previewContainer.classList.add('p-3');
        });

        previewPortalBtn.addEventListener('click', function() {
          this.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-xs', 'font-bold');
          this.classList.remove('text-on-surface-variant');
          previewEmailBtn.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-xs', 'font-bold');
          previewEmailBtn.classList.add('text-on-surface-variant');
          previewContainer.classList.remove('p-3');
          previewContainer.classList.add('p-1');
        });
      }
    })();
  <§/script>
