  function triggerRefresh() {
    const icon = document.getElementById('refresh-icon');
    if (!icon) return;
    icon.classList.add('animate-spin');
    setTimeout(() => {
      icon.classList.remove('animate-spin');
    }, 800);
  }

  function openReviewModal(invId, amount, method) {
    const modal = document.getElementById('review-modal');
    const card = document.getElementById('modal-card');
    const subtitle = document.getElementById('modal-inv-subtitle');
    const amountTag = document.getElementById('modal-amount-tag');
    const methodTag = document.getElementById('modal-method-tag');

    if (subtitle) subtitle.textContent = 'Auditing ' + invId;
    if (amountTag) amountTag.textContent = amount;
    if (methodTag) methodTag.textContent = method + ' Remittance';

    if (modal && card) {
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }
  }

  function closeReviewModal() {
    const modal = document.getElementById('review-modal');
    const card = document.getElementById('modal-card');
    if (modal && card) {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
      card.classList.add('scale-95');
      card.classList.remove('scale-100');
    }
  }

  function executeVerify() {
    closeReviewModal();
  }

  function executeReject() {
    closeReviewModal();
  }

  // Filter Pill micro-interactions
  document.querySelectorAll('.filter-method-btn').forEach(btn => {

      document.querySelectorAll('.filter-method-btn').forEach(b => {
        b.classList.remove('active', 'bg-surface-container-lowest', 'text-on-surface', 'shadow-sm', 'font-bold');
        b.classList.add('text-on-surface-variant');
      });
      this.classList.add('active', 'bg-surface-container-lowest', 'text-on-surface', 'shadow-sm', 'font-bold');
      this.classList.remove('text-on-surface-variant');
    });
  });
