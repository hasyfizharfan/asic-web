<div>

          <§/div>

          <§/p>

<§!-- Authentication Form -->

            <§/label>

              <§/label>

              <§/a>

<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface p-1 rounded-lg transition-colors flex items-center justify-center" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">

<§/label>

            <§/a>

<§/button>

<§!-- Notification Banner Overlay (Micro-interaction) -->

<span class="font-body-md text-body-md" id="toast-message"><§/span>
<§/div>
<§!-- Client-side Micro-interactions -->
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const pwdIcon = document.getElementById('pwd-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.textContent = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        pwdIcon.textContent = 'visibility';
      }
    }

    function setLanguage(lang) {
      const btnEn = document.getElementById('lang-en');
      const btnId = document.getElementById('lang-id');
      if (lang === 'EN') {
        btnEn.className = 'px-3 py-1 rounded-full font-label-sm text-label-sm bg-surface-container-lowest text-primary shadow-sm font-bold transition-all duration-200';
        btnId.className = 'px-3 py-1 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-all duration-200';
        triggerToast('Language changed to English (EN)');
      } else {
        btnId.className = 'px-3 py-1 rounded-full font-label-sm text-label-sm bg-surface-container-lowest text-primary shadow-sm font-bold transition-all duration-200';
        btnEn.className = 'px-3 py-1 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-all duration-200';
        triggerToast('Bahasa dialihkan ke Bahasa Indonesia (ID)');
      }
    }

    function fillDemoAccount() {
      const idInput = document.getElementById('identifier');
      const pwdInput = document.getElementById('password');
      idInput.value = 'participant.demo@unand.ac.id';
      pwdInput.value = 'ASIC2027#SecureAccess';
      triggerToast('Demo participant credentials pre-filled.');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const idInput = document.getElementById('identifier').value;
      if (!idInput) return;
      triggerToast('Authenticating with ASIC 2027 Portal...');
    }

    function openForgotNotice() {
      triggerToast('Credential recovery protocol forwarded to administrator.');
    }

    function showRegisterNotice() {
      triggerToast('Participant registration timeline: TBA.');
    }

    function triggerToast(msg) {
      const toast = document.getElementById('status-toast');
      const msgElem = document.getElementById('toast-message');
      msgElem.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }
  <§/script>
