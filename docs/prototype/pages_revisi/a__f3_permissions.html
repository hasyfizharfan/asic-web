<script>
  // Active Sidebar Item synchronization
  (function() {
    const navLinks = document.querySelectorAll('aside nav a');
    navLinks.forEach(link => {
      if (link.getAttribute('data-path') === 'permissions') {
        link.className = "flex items-center gap-space-sm px-space-md py-space-sm rounded-xl bg-primary-container text-on-primary font-label-lg shadow-sm";
        const icon = link.querySelector('.material-symbols-outlined');
        if (icon) icon.className = "material-symbols-outlined text-[20px] text-tertiary-fixed";
      }
    });

    // Collapsible Accordion logic
    const sectionHeaders = document.querySelectorAll('[data-accordion]');
    let allExpanded = true;

    sectionHeaders.forEach(header => {
      header.addEventListener('click', () => {
        const sectionId = header.getAttribute('data-accordion');
        const rows = document.querySelectorAll('.' + sectionId + '-row');
        const icon = document.getElementById('icon-' + sectionId);

        let isCurrentlyHidden = false;
        rows.forEach(r => {
          if (r.classList.contains('hidden')) {
            r.classList.remove('hidden');
          } else {
            r.classList.add('hidden');
            isCurrentlyHidden = true;
          }
        });

        if (icon) {
          icon.style.transform = isCurrentlyHidden ? 'rotate(-90deg)' : 'rotate(0deg)';
        }
      });
    });

    // Expand / Collapse All
    const expandAllBtn = document.getElementById('expand-all-btn');
    if (expandAllBtn) {
      expandAllBtn.addEventListener('click', () => {
        allExpanded = !allExpanded;
        const allRows = document.querySelectorAll('tr[class*="-row"]');
        const allIcons = document.querySelectorAll('[id^="icon-sec-"]');

        allRows.forEach(r => {
          if (allExpanded) {
            r.classList.remove('hidden');
          } else {
            r.classList.add('hidden');
          }
        });

        allIcons.forEach(ic => {
          ic.style.transform = allExpanded ? 'rotate(0deg)' : 'rotate(-90deg)';
        });

        expandAllBtn.innerHTML = allExpanded 
          ? '<span class="material-symbols-outlined text-[16px]">unfold_less<§/span> Collapse All Sections'
          : '<span class="material-symbols-outlined text-[16px]">unfold_more<§/span> Expand All Sections';
      });
    }

    // Save Policy Changes Toast Simulation
    const saveBtn = document.getElementById('save-policy-btn');
    const toast = document.getElementById('save-toast');

    if (saveBtn && toast) {
      saveBtn.addEventListener('click', () => {
        toast.classList.remove('translate-y-24', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-24', 'opacity-0');
        }, 3500);
      });
    }
  })();
<§/script><§/main><§/div>
